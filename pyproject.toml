[project]
name = "dis-reconstrucao"
version = "0.1.0"
description = "Servidores de reconstrução de imagens (Python e C++), cliente e monitor (ICSM31)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "threadpoolctl>=3.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "psutil>=6.0",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
